<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý Quân nhân V4 - Demo</title><style>:root{--bg:#071c0b;--panel:#1e4024;--green:#20662b;--gold:#ffca28;--text:#e9f3e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}header{background:linear-gradient(90deg,#165721,#278038);border-bottom:2px solid var(--gold);padding:13px 18px;display:flex;align-items:center;gap:15px;position:sticky;top:0;z-index:3}header strong{font-size:18px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:5px;padding:9px 12px;background:var(--gold);color:#183519}button.alt{background:#277e38;color:white}button.blue{background:#00a7d9;color:white}button.red{background:#c93c39;color:white}.layout{display:flex;min-height:calc(100vh - 57px)}nav{width:230px;background:#1a301c;border-right:1px solid #4a6d4b;padding:12px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:#d3e8d3}nav button.active{background:#277d36;color:#fff;border-left:3px solid var(--gold)}main{padding:24px;flex:1;min-width:0}.panel{background:var(--panel);border:1px solid #456449;border-radius:9px;padding:18px;margin:0 0 18px}.panel h3{color:var(--gold);margin:0 0 16px;font-size:16px}.stats,.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.stat{padding:20px;background:#234a2a;border-radius:10px;text-align:center}.stat b{font-size:30px;display:block}.stat small{color:#b7cdb9}.cards button{min-height:130px;text-align:left;background:linear-gradient(125deg,#1a4122,#226b30);color:white;padding:24px;border:1px solid #447a4a;font-weight:bold;font-size:18px}.cards small{display:block;font-size:13px;font-weight:normal;margin-top:14px}.hero{min-height:230px;background:linear-gradient(0deg,#061b0bd9,#061b0b8c),repeating-linear-gradient(135deg,#283a24 0 22px,#596345 22px 44px,#222e24 44px 66px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;margin:-24px -24px 24px;padding:20px}.hero h1{letter-spacing:2px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{max-width:250px}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field input,.field select,.field textarea, .toolbar input,.toolbar select{padding:10px;border:1px solid #527256;background:#122b18;color:white;border-radius:5px}table{border-collapse:collapse;width:100%;min-width:640px}th{background:#1a6129;border-bottom:2px solid var(--gold);text-align:left}th,td{padding:12px;border-bottom:1px solid #446047}td button{margin:2px;padding:6px 9px}.scroll{overflow:auto}.tree{margin:8px 0 8px 16px;padding:12px;background:#17351d;border:1px solid #416044;border-radius:5px}.tree button{float:right;margin-left:5px;padding:4px 9px}.muted{color:#adc7b1}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5;padding:15px}.modal.show{display:flex}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:#203f25;border:1px solid var(--gold);border-radius:10px;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#28532e;color:white}.tabs button.active{background:var(--gold);color:#193519}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{background:#513f16;padding:12px;border-radius:5px;color:#ffe3a4;margin-bottom:16px}canvas{max-width:100%}@media(max-width:700px){header strong{font-size:15px}nav{width:70px;padding:5px}nav button{font-size:0;text-align:center;padding:12px 0}nav button span{font-size:22px}main{padding:12px}.hero{margin:-12px -12px 12px;min-height:180px}.hero h1{font-size:20px}.stats,.cards{grid-template-columns:1fr 1fr;gap:8px}.cards button{min-height:95px;padding:12px;font-size:14px}.stat{padding:12px}.stat b{font-size:22px}.panel{padding:12px}.grid2{grid-template-columns:1fr}}
</style></head><body><header><button onclick="page('home')">Trang chủ</button><strong id="heading">QUẢN LÝ QUÂN NHÂN</strong><span style="margin-left:auto;color:#ffe18c">★ V4 DEMO</span></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div><div class="modal" id="modal"><div class="dialog"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="modalTitle" style="color:#ffca28"></h3><button onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><script>
const names=[['home','⌂','Trang chủ'],['units','▦','Quản lý đơn vị'],['people','♙','Quản lý quân nhân'],['attendance','☑','Điểm danh'],['advanced','▤','Tính năng nâng cao'],['calendar','▣','Lịch công tác'],['reminders','♧','Nhắc hẹn'],['reports','◫','Thống kê']];const initial={units:[{id:1,name:'Trung đoàn 101',parent:0},{id:2,name:'Tiểu đoàn 1',parent:1},{id:3,name:'Đại đội 1',parent:2},{id:4,name:'Đại đội 2',parent:2},{id:5,name:'Đại đội 3',parent:2},{id:6,name:'Tiểu đoàn 2',parent:1}],people:[{id:1,first:'Nguyễn Văn',last:'An',rank:'Trung úy',role:'Đại đội trưởng',unit:3},{id:2,first:'Trần Minh',last:'Bình',rank:'Thượng úy',role:'Chính trị viên',unit:3},{id:3,first:'Lê Quốc',last:'Huy',rank:'Thiếu úy',role:'Trung đội trưởng',unit:4}],attendance:[],reminders:[],schedule:{}};let db;try{db=JSON.parse(localStorage.getItem('qlqn_v4_demo'))||structuredClone(initial)}catch(e){db=JSON.parse(JSON.stringify(initial))}function save(){try{localStorage.setItem('qlqn_v4_demo',JSON.stringify(db))}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function unit(id){return db.units.find(x=>x.id==id)?.name||'Chưa phân đơn vị'}function opts(value){return db.units.map(u=>`<option value="${u.id}" ${u.id==value?'selected':''}>${esc(u.name)}</option>`).join('')}function btn(label,action,cls=''){return `<button class="${cls}" onclick="${action}">${label}</button>`}function page(p){window.current=p;document.getElementById('heading').textContent=(names.find(x=>x[0]===p)||names[0])[2].toUpperCase();document.getElementById('nav').innerHTML=names.map(n=>`<button class="${p===n[0]?'active':''}" onclick="page('${n[0]}')"><span>${n[1]}</span> ${n[2]}</button>`).join('');document.getElementById('main').innerHTML=({home,units,people,attendance,advanced,calendar,reminders,reports}[p]||home)();window.scrollTo(0,0)}function openModal(t,html){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function home(){return `<div class="hero"><div style="font-size:60px;color:#ffca28">★</div><h1>PHẦN MỀM QUẢN LÝ QUÂN NHÂN</h1><p>Hệ thống quản lý thông tin và điểm danh quân nhân</p><small>GIAO DIỆN LỤC QUÂN • BẢN DEMO</small></div><div class="notice">Bản trình diễn công khai: chỉ sử dụng dữ liệu giả. Dữ liệu thử được lưu trong trình duyệt hiện tại.</div><div class="stats"><div class="stat"><b>${db.people.length}</b><small>Quân nhân</small></div><div class="stat"><b>${db.units.length}</b><small>Đơn vị</small></div><div class="stat"><b>${new Set(db.attendance.map(a=>a.date)).size}</b><small>Ngày điểm danh</small></div></div><h3 style="color:#ffca28;margin-top:32px">▦ Danh mục chức năng</h3><div class="cards">${names.slice(1).map(n=>`<button onclick="page('${n[0]}')">${n[1]} ${n[2]}<small>Mở chức năng quản lý</small></button>`).join('')}</div>`}function tree(parent=0,depth=0){return db.units.filter(u=>u.parent==parent).map(u=>`<div class="tree" style="margin-left:${Math.min(depth*18,72)}px">${btn('Sửa',`editUnit(${u.id})`)}${btn('Thêm',`editUnit(0,${u.id})`,'alt')}<b>${esc(u.name)}</b> <small class="muted">(${db.people.filter(p=>p.unit==u.id).length} người trực thuộc)</small>${tree(u.id,depth+1)}</div>`).join('')}function units(){return `<div class="panel"><h3>Cây tổ chức đơn vị</h3><div class="toolbar">${btn('＋ Tạo đơn vị mới','editUnit(0,0)')}${btn('Sơ đồ đơn vị','alert("Cây tổ chức đang hiển thị bên dưới")','alt')}</div>${tree()}</div>`}function editUnit(id=0,parent=0){let u=db.units.find(x=>x.id==id)||{name:'',parent};openModal(id?'Sửa đơn vị':'Thêm đơn vị',`<div class="field">Tên đơn vị<input id="uName" value="${esc(u.name)}"></div><div class="field">Đơn vị cấp trên<select id="uParent"><option value="0">Cấp gốc</option>${opts(u.parent)}</select></div>${btn('Lưu đơn vị',`saveUnit(${id})`)}`)}function saveUnit(id){let name=document.getElementById('uName').value.trim(),parent=+document.getElementById('uParent').value;if(!name||id===parent)return alert('Kiểm tra tên và cấp trên');if(id){let u=db.units.find(x=>x.id===id);u.name=name;u.parent=parent}else db.units.push({id:Date.now(),name,parent});save();closeModal();page('units')}
function people(){return `<div class="panel"><h3>Quản lý quân nhân (${db.people.length} người)</h3><div class="toolbar"><input id="search" placeholder="Tìm họ tên, cấp bậc..." oninput="filterPeople()"><select id="unitFilter" onchange="filterPeople()"><option value="">Tất cả đơn vị</option>${opts()}</select>${btn('＋ Thêm quân nhân','editPerson(0)','alt')}${btn('Xuất dữ liệu QN','exportCsv()','blue')}</div><div class="scroll"><table><thead><tr><th>STT</th><th>Họ tên</th><th>Cấp bậc</th><th>Chức vụ</th><th>Đơn vị</th><th>Thao tác</th></tr></thead><tbody id="peopleRows">${rows()}</tbody></table></div></div>`}function rows(){return db.people.map((p,i)=>`<tr data-search="${esc((p.first+' '+p.last+' '+p.rank).toLowerCase())}" data-unit="${p.unit}"><td>${i+1}</td><td>${esc(p.first+' '+p.last)}</td><td>${esc(p.rank)}</td><td>${esc(p.role)}</td><td>${esc(unit(p.unit))}</td><td>${btn('Xem',`viewPerson(${p.id})`,'blue')} ${btn('Sửa',`editPerson(${p.id})`)} ${btn('Xóa',`delPerson(${p.id})`,'red')}</td></tr>`).join('')}function filterPeople(){let s=document.getElementById('search').value.toLowerCase(),u=document.getElementById('unitFilter').value;document.querySelectorAll('#peopleRows tr').forEach(r=>r.style.display=r.dataset.search.includes(s)&&(!u||r.dataset.unit===u)?'':'none')}function personForm(p){return `<div class="tabs"><button class="active">I. Lý lịch</button><button type="button" onclick="alert('Mục lịch sử sẽ hoàn thiện trong bản có cơ sở dữ liệu')">II. Lịch sử</button><button type="button" onclick="alert('Mục sức khỏe sẽ hoàn thiện trong bản có cơ sở dữ liệu')">III. Sức khỏe</button><button type="button" onclick="alert('Mục quân trang sẽ hoàn thiện trong bản có cơ sở dữ liệu')">IV. Quân trang</button><button type="button" onclick="alert('Mục khác sẽ hoàn thiện trong bản có cơ sở dữ liệu')">V. Khác</button></div><div class="grid2"><div class="field">Họ và tên đệm<input id="pFirst" value="${esc(p.first)}"></div><div class="field">Tên<input id="pLast" value="${esc(p.last)}"></div><div class="field">Cấp bậc<input id="pRank" value="${esc(p.rank)}"></div><div class="field">Chức vụ<input id="pRole" value="${esc(p.role)}"></div><div class="field">Đơn vị<select id="pUnit">${opts(p.unit)}</select></div></div>`}function editPerson(id){let p=db.people.find(x=>x.id==id)||{first:'',last:'',rank:'',role:'',unit:db.units[0]?.id};openModal(id?'Chỉnh sửa thông tin quân nhân':'Thêm quân nhân',personForm(p)+btn('Lưu thông tin',`savePerson(${id})`))}function savePerson(id){let p={first:document.getElementById('pFirst').value.trim(),last:document.getElementById('pLast').value.trim(),rank:document.getElementById('pRank').value.trim(),role:document.getElementById('pRole').value.trim(),unit:+document.getElementById('pUnit').value};if(!p.first||!p.last)return alert('Nhập đầy đủ họ tên');if(id)Object.assign(db.people.find(x=>x.id==id),p);else db.people.push({id:Date.now(),...p});save();closeModal();page('people')}function viewPerson(id){let p=db.people.find(x=>x.id==id);openModal('Thông tin quân nhân',`<h2 style="color:#ffca28;text-align:center">${esc(p.first+' '+p.last)}</h2><p style="text-align:center">${esc(p.rank)} – ${esc(p.role)} – ${esc(unit(p.unit))}</p><div class="tabs"><button class="active">I. Lý lịch</button><button>II. Lịch sử</button><button>III. Sức khỏe</button><button>IV. Quân trang</button><button>V. Khác</button></div><p>Thông tin hồ sơ mẫu. Các mục chi tiết sẽ được bổ sung trong giai đoạn tiếp theo.</p>${btn('Chỉnh sửa',`editPerson(${id})`)}`)}function delPerson(id){if(confirm('Xóa quân nhân mẫu này?')){db.people=db.people.filter(x=>x.id!==id);save();page('people')}}function attendance(){let date=new Date().toISOString().slice(0,10);return `<div class="panel"><h3>Điểm danh quân số</h3><div class="toolbar"><input type="date" id="attDate" value="${date}" onchange="renderAttendance()">${btn('Lưu điểm danh','saveAttendance()','alt')}</div><div class="scroll"><table><thead><tr><th>Họ tên</th><th>Đơn vị</th><th>Trạng thái</th></tr></thead><tbody id="attRows"></tbody></table></div></div><div class="panel"><h3>Lịch sử điểm danh</h3><div id="attHistory">${history()}</div></div>`}function renderAttendance(){let d=document.getElementById('attDate').value;document.getElementById('attRows').innerHTML=db.people.map(p=>{let a=db.attendance.find(x=>x.date===d&&x.person===p.id);return `<tr><td>${esc(p.first+' '+p.last)}</td><td>${esc(unit(p.unit))}</td><td><select data-person="${p.id}" class="attStatus"><option value="present" ${a?.status==='present'?'selected':''}>Có mặt</option><option value="leave" ${a?.status==='leave'?'selected':''}>Phép</option><option value="duty" ${a?.status==='duty'?'selected':''}>Tranh thủ / công tác</option><option value="absent" ${a?.status==='absent'?'selected':''}>Vắng</option></select></td></tr>`}).join('')}function saveAttendance(){let date=document.getElementById('attDate').value;db.attendance=db.attendance.filter(x=>x.date!==date);document.querySelectorAll('.attStatus').forEach(s=>db.attendance.push({date,person:+s.dataset.person,status:s.value}));save();page('attendance')}function history(){return [...new Set(db.attendance.map(x=>x.date))].sort().reverse().map(d=>`<p>${d}: ${db.attendance.filter(x=>x.date===d&&x.status==='present').length}/${db.attendance.filter(x=>x.date===d).length} có mặt</p>`).join('')||'<p class="muted">Chưa có dữ liệu điểm danh.</p>'}function advanced(){return `<div class="panel"><h3>Xuất trích ngang – Thiết kế mẫu</h3><p>Kéo thả và định dạng mẫu báo cáo là chức năng dự kiến của bản đầy đủ.</p><div class="toolbar">${btn('Xuất danh sách CSV','exportCsv()','alt')}${btn('Xem danh sách quân nhân',"page('people')")}</div><div class="scroll"><table><tr><th>STT</th><th>Họ và tên</th><th>Cấp bậc</th><th>Đơn vị</th></tr>${db.people.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.first+' '+p.last)}</td><td>${esc(p.rank)}</td><td>${esc(unit(p.unit))}</td></tr>`).join('')}</table></div></div>`}function exportCsv(){let rows=[['Họ và tên','Cấp bậc','Chức vụ','Đơn vị'],...db.people.map(p=>[p.first+' '+p.last,p.rank,p.role,unit(p.unit)])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='danh_sach_quan_nhan_demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function calendar(){let days=['Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy','Chủ nhật'];return `<div class="panel"><h3>Lịch công tác tuần</h3><div class="notice">Nội dung lưu thử trên trình duyệt, không dùng để quản lý nhiệm vụ thực tế.</div><div class="scroll"><table><thead><tr><th>Buổi</th>${days.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${['Sáng','Chiều','Tối'].map(b=>`<tr><th>${b}</th>${days.map((d,i)=>`<td><textarea rows="3" style="width:150px" onchange="db.schedule['${i}-${b}']=this.value;save()">${esc(db.schedule[i+'-'+b]||'')}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}function reminders(){return `<div class="panel"><h3>Nhắc hẹn</h3>${btn('＋ Thêm nội dung công việc','editReminder()')}<div class="scroll" style="margin-top:16px"><table><thead><tr><th>Nội dung</th><th>Thời gian</th><th>Người phụ trách</th><th>Thao tác</th></tr></thead><tbody>${db.reminders.map(r=>`<tr><td>${esc(r.content)}</td><td>${esc(r.date)}</td><td>${esc(r.owner)}</td><td>${btn('Xóa',`deleteReminder(${r.id})`,'red')}</td></tr>`).join('')}</tbody></table></div></div>`}function editReminder(){openModal('Thêm nhắc hẹn',`<div class="field">Nội dung<input id="rContent"></div><div class="field">Thời gian<input type="datetime-local" id="rDate"></div><div class="field">Người phụ trách<input id="rOwner"></div>${btn('Lưu','saveReminder()')}`)}function saveReminder(){let content=document.getElementById('rContent').value,date=document.getElementById('rDate').value,owner=document.getElementById('rOwner').value;if(!content)return alert('Nhập nội dung');db.reminders.push({id:Date.now(),content,date,owner});save();closeModal();page('reminders')}function deleteReminder(id){db.reminders=db.reminders.filter(x=>x.id!==id);save();page('reminders')}function reports(){let dates=[...new Set(db.attendance.map(x=>x.date))].sort(),total=dates.length,rate=total?Math.round(db.attendance.filter(a=>a.status==='present').length/db.attendance.length*100):0;return `<div class="panel"><h3>Tỷ lệ quân số có mặt theo ngày</h3><div class="stats"><div class="stat"><b>${rate}%</b><small>Tỷ lệ có mặt</small></div><div class="stat"><b>${total}</b><small>Số ngày điểm danh</small></div><div class="stat"><b>${db.people.length}</b><small>Quân số mẫu</small></div></div></div><div class="panel"><h3>Bảng dữ liệu biểu đồ</h3><div class="scroll"><table><tr><th>Ngày</th><th>Tổng lượt</th><th>Có mặt</th><th>Tỷ lệ</th></tr>${dates.map(d=>{let a=db.attendance.filter(x=>x.date===d),n=a.filter(x=>x.status==='present').length;return `<tr><td>${d}</td><td>${a.length}</td><td>${n}</td><td>${a.length?Math.round(n/a.length*100):0}%</td></tr>`}).join('')}</table></div></div>`}page('home');
</script></body></html>
